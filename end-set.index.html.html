<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作戦板</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the court leads, the controls sit directly under it, and the step list takes a right column on wide screens. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --fg:#16202a; --muted:#566574; --line:#d3dae1;
  --court:#e6cd9e; --court-paint:#d9b57c; --court-line:#4a3b2a; --ghost:#4a3b2a; --out:#cfd6dc;
  --pa:#2b6cd8; --pb:#d6452a; --pc:#7b4cc9; --pd:#0e8a80; --pe:#4a5866; --on-player:#ffffff;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171d; --surface:#1b222a; --fg:#e8edf2; --muted:#9aa8b6; --line:#2d3740;
    --court:#463a2b; --court-paint:#58472f; --court-line:#cdbfa6; --ghost:#cdbfa6; --out:#222a32;
    --pa:#6ea3ff; --pb:#ff7f66; --pc:#b99aff; --pd:#46d2c4; --pe:#aebbc8; --on-player:#10161c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222a; --fg:#e8edf2; --muted:#9aa8b6; --line:#2d3740;
  --court:#463a2b; --court-paint:#58472f; --court-line:#cdbfa6; --ghost:#cdbfa6; --out:#222a32;
  --pa:#6ea3ff; --pb:#ff7f66; --pc:#b99aff; --pd:#46d2c4; --pe:#aebbc8; --on-player:#10161c;
  color-scheme:dark;
}

html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg); color:var(--fg);
  font:400 15px/1.65 var(--font-body);
  padding-block:20px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1040px; margin:0 auto; display:grid; gap:16px}
h1{margin:0; font-size:24px; line-height:1.3; font-weight:700; text-wrap:balance}
h2{margin:0 0 10px; font-size:15px; font-weight:700}
.meta{margin:2px 0 0; color:var(--muted); font-size:13px}

.tabs{display:inline-flex; margin-top:12px}
.tabs button{min-height:44px; padding:0 18px; border:1px solid var(--line); background:var(--surface); font:700 16px var(--font-body)}
.tabs button+button{border-left:0}
.tabs button:first-child{border-radius:8px 0 0 8px}
.tabs button:last-child{border-radius:0 8px 8px 0}
.tabs button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}

.layout{display:grid; gap:16px; grid-template-columns:minmax(0,1fr); align-items:start}
@media (min-width:880px){ .layout{grid-template-columns:minmax(0,1fr) 320px} }
.board{display:grid; gap:12px; min-width:0}

.court-frame{border-radius:10px; overflow:hidden; border:1px solid var(--line)}
#court{display:block; width:100%; height:auto}

/* court */
.out{fill:var(--out)}
.floor{fill:var(--court)}
.paint{fill:var(--court-paint); stroke:var(--court-line); stroke-width:6}
.lines path,.lines rect{fill:none; stroke:var(--court-line); stroke-width:6}
.hoop{opacity:.4}
.hoop circle,.hoop line{fill:none; stroke:var(--court-line); stroke-width:6}
.court-label{fill:var(--court-line); opacity:.6; font:500 26px var(--font-body)}

/* players and lines share one colour per player through --c */
.pA{--c:var(--pa)} .pB{--c:var(--pb)} .pC{--c:var(--pc)} .pD{--c:var(--pd)} .pE{--c:var(--pe)}
.ghost{fill:none; stroke:var(--ghost); stroke-width:4; stroke-dasharray:8 8; opacity:.5}
.plan-line{fill:none; stroke:var(--c); stroke-width:8; stroke-dasharray:22 16; opacity:.4}
.plan-head{fill:var(--c); opacity:.5}
.trail{fill:none; stroke:var(--c); stroke-width:10; stroke-linecap:round; stroke-linejoin:round}
.bar{stroke:var(--c); stroke-width:16; stroke-linecap:round}
.pl circle{fill:var(--c); stroke:var(--surface); stroke-width:5}
.plabel{fill:var(--on-player); font:700 56px var(--font-num); pointer-events:none}

/* controls */
.controls{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:grid; gap:10px}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.time{margin-left:auto; font:600 20px var(--font-num); font-variant-numeric:tabular-nums; color:var(--muted)}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--pa); outline-offset:2px}
.primary{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 18px; border-radius:8px; border:0; background:var(--fg); color:var(--bg); font-weight:700}
.primary svg{width:18px; height:18px; fill:currentColor}
.ghostbtn{min-height:44px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:transparent; font-weight:500}
#scrub{width:100%; height:28px; accent-color:var(--pa); margin:0}
.seg{display:inline-flex}
.seg button{min-height:36px; padding:0 12px; border:1px solid var(--line); background:transparent; font:600 16px var(--font-num)}
.seg button+button{border-left:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.opt{display:inline-flex; align-items:center; gap:6px; min-height:36px; font-size:14px}
.opt input{width:18px; height:18px; accent-color:var(--pa); margin:0}

/* steps */
.steps{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0}
.steps ol{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.step{width:100%; text-align:left; display:grid; gap:2px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:transparent}
.step[aria-current="step"]{border-color:var(--fg); background:var(--bg)}
.when{font:600 15px var(--font-num); letter-spacing:.04em; color:var(--muted); font-variant-numeric:tabular-nums}
.what{font-size:14px; line-height:1.7}
.chip{display:inline-grid; place-items:center; width:1.55em; height:1.55em; border-radius:50%; background:var(--c); color:var(--on-player); font:700 .95em var(--font-num); vertical-align:.05em; margin-inline:.1em}
.note{margin:12px 2px 0; font-size:13px; color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>作戦板</h1>
    <p class="meta" id="meta"></p>
    <div class="tabs" id="tabs" role="group" aria-label="プレーを選ぶ"></div>
  </header>

  <main class="layout">
    <section class="board" aria-label="作戦板">
      <div class="court-frame">
        <svg id="court" viewBox="920 120 1560 1360" role="img" aria-label="">
          <rect class="out" x="920" y="1335" width="1560" height="145"/>
          <rect class="floor" x="920" y="120" width="1560" height="1215"/>
          <rect class="paint" x="1435" y="775" width="515" height="560"/>
          <g class="lines">
            <rect x="923" y="123" width="1554" height="1209"/>
            <path d="M1030,1332 V840 A670,395 0 0 1 2370,840 V1332"/>
            <path d="M1435,775 A257.5,255 0 0 1 1950,775"/>
          </g>
          <g class="hoop">
            <circle cx="1692" cy="1178" r="20"/>
            <line x1="1692" y1="1198" x2="1692" y2="1212"/>
            <line x1="1602" y1="1212" x2="1782" y2="1212" stroke-width="9"/>
          </g>
          <text class="court-label" x="950" y="1308">ベースライン</text>

          <g id="ghosts"></g>
          <g id="plan"></g>
          <g id="bars"></g>
          <g id="trails"></g>
          <g id="players"></g>
        </svg>
      </div>

      <div class="controls" role="group" aria-label="再生コントロール">
        <div class="row">
          <button id="playBtn" class="primary" type="button"></button>
          <button id="replayBtn" class="ghostbtn" type="button">最初から</button>
          <output id="timeOut" class="time" for="scrub">0.0 / 0.0秒</output>
        </div>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="再生位置">
        <div class="row">
          <div class="seg" role="group" aria-label="再生速度">
            <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
            <button type="button" data-speed="1" aria-pressed="true">1×</button>
            <button type="button" data-speed="2" aria-pressed="false">2×</button>
          </div>
          <label class="opt" for="loopChk"><input id="loopChk" type="checkbox" checked>くり返し</label>
          <label class="opt" for="planChk"><input id="planChk" type="checkbox" checked>予定の線を表示</label>
        </div>
      </div>
    </section>

    <aside class="steps" aria-label="動きの手順">
      <h2>動きの手順</h2>
      <ol id="stepList"></ol>
      <p class="note" id="note"></p>
    </aside>
  </main>
</div>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var START_HOLD = 0.6, END_HOLD = 1.2;

  function chip(w){ return '<span class="chip p' + w + '">' + w + '</span>'; }

  // Waypoints are read off the hand-drawn sheets (photo coordinates mapped onto one court).
  var PLAYS = [
    {
      label: 'プレー①', total: 6.5,
      meta: 'ハーフコート ・ 4人 ・ 約6.5秒',
      aria: 'ハーフコートの作戦図。Bが左ショートコーナーへカット、Cがゴール下中央でスクリーン、Dがゴール下を横切ってレーン中央へ、そのあとCが右コーナーへ動く。Aは左コーナー付近で動かない。',
      start: { A:[975,1100], B:[1435,920], C:[1440,1130], D:[1955,1150] },
      moves: [
        { who:'B', t0:0.0, t1:1.7, pts:[[1435,920],[1380,1005],[1336,1105],[1316,1205]] },
        { who:'C', t0:0.0, t1:1.5, pts:[[1440,1130],[1648,1110]] },
        { who:'D', t0:1.6, t1:5.0, pts:[[1955,1150],[1830,1196],[1700,1210],[1565,1200],[1465,1170],[1370,1085],[1345,965],[1385,870],[1485,835],[1600,858],[1670,925],[1690,985]] },
        { who:'C', t0:2.8, t1:5.2, pts:[[1648,1110],[1930,1092],[2180,1085],[2395,1085]] }
      ],
      bars: [ { x1:1722, y1:1046, x2:1722, y2:1174, cls:'pC', inT:1.2, outT:2.8 } ],
      steps: [
        { t:0.0, html: chip('B') + 'が左ショートコーナーへカット。' + chip('C') + 'はゴール下中央へ動いてスクリーンをセット。' },
        { t:1.6, html: chip('D') + 'が右ブロックからゴール下を横切り、' + chip('C') + 'のスクリーンを使って左へ抜ける。そのまま回り込み、レーン中央へカール。' },
        { t:2.8, html: 'スクリーンを終えた' + chip('C') + 'が右コーナーへポップアウト。' }
      ],
      note: chip('A') + 'は左コーナー付近から動きません。手順をタップすると、そこから再生します。'
    },
    {
      label: 'プレー②', total: 4.6,
      meta: 'ハーフコート ・ 5人 ・ 約4.6秒',
      aria: 'ハーフコートの作戦図。レーン左側に縦一列に並んだA、B、C、Dと、ベースラインの外のE。Bが左コーナー、Dが右コーナーへ動き、Cがスクリーンをセットし、Aがそれを使って左ショートコーナーへ回り込む。Eは動かない。',
      start: { A:[1432,826], B:[1432,960], C:[1432,1060], D:[1432,1177], E:[1448,1407] },
      moves: [
        { who:'B', t0:0.0, t1:1.4, pts:[[1432,960],[985,1200]] },
        { who:'D', t0:0.0, t1:2.6, pts:[[1432,1177],[1880,1184],[2342,1189]] },
        { who:'C', t0:0.6, t1:1.8, pts:[[1432,1060],[1396,1030],[1372,985]] },
        { who:'A', t0:1.6, t1:3.8, pts:[[1432,826],[1380,833],[1336,850],[1293,898],[1267,977],[1261,1048],[1271,1120],[1297,1177],[1318,1232]] }
      ],
      bars: [ { x1:1306, y1:915, x2:1426, y2:915, cls:'pC', inT:1.4, outT:null } ],
      steps: [
        { t:0.0, html: chip('B') + 'が左コーナーへ、' + chip('D') + 'が右コーナーへ、縦一列から飛び出す。' },
        { t:0.6, html: chip('C') + 'が左上へ動いて、レーン左側でスクリーンをセット。' },
        { t:1.6, html: chip('A') + 'が' + chip('C') + 'のスクリーンを使って回り込み、左ショートコーナーへ。' }
      ],
      note: chip('E') + 'はベースラインの外にいて動きません。手順をタップすると、そこから再生します。'
    },
    {
      label: 'プレー③', total: 4.8,
      meta: 'ハーフコート ・ 5人 ・ 約4.8秒',
      aria: 'ハーフコートの作戦図。左右のエルボーにAとB、左右のブロックにCとD、ベースラインの外にE。Aが右へ動いてスクリーン、Bがそれを使って左へ回り込む。Cが右へ動いてスクリーン、Dがその上を通って左コーナーへ。Cはそのあと右のベースライン側へ動く。Eは動かない。',
      start: { A:[1440,826], B:[1932,826], C:[1440,1177], D:[1932,1177], E:[1450,1410] },
      moves: [
        { who:'A', t0:0.0, t1:1.3, pts:[[1440,826],[1510,868],[1590,882],[1668,880]] },
        { who:'C', t0:0.0, t1:1.6, pts:[[1440,1177],[1600,1182],[1775,1187]] },
        { who:'B', t0:1.2, t1:3.2, pts:[[1932,826],[1847,805],[1799,793],[1743,791],[1687,798],[1632,820],[1587,860],[1559,916],[1546,979],[1534,1038]] },
        { who:'D', t0:1.4, t1:4.2, pts:[[1932,1177],[1896,1126],[1840,1101],[1771,1091],[1701,1088],[1562,1091],[1423,1102],[1284,1136],[1187,1168],[1080,1205],[1040,1228]] },
        { who:'C', t0:2.4, t1:3.4, pts:[[1775,1187],[1834,1246],[1892,1285]] }
      ],
      bars: [
        { x1:1738, y1:824, x2:1738, y2:936, cls:'pA', inT:1.0, outT:null },
        { x1:1835, y1:1122, x2:1835, y2:1238, cls:'pC', inT:1.4, outT:2.6 }
      ],
      steps: [
        { t:0.0, html: chip('A') + 'が右へ動いてレーン上側でスクリーン。' + chip('C') + 'も右へ動いて、ゴール下側でスクリーンをセット。' },
        { t:1.2, html: chip('B') + 'が' + chip('A') + 'のスクリーンを使い、レーン上側を左へ回り込んで、レーン左側の中ほどへ。' },
        { t:1.4, html: chip('D') + 'が' + chip('C') + 'のスクリーンの上を通り、レーンを横切って左コーナーへ。' },
        { t:2.4, html: 'スクリーンを終えた' + chip('C') + 'が右ブロックのベースライン側へ動く。' }
      ],
      note: chip('E') + 'はベースラインの外にいて動きません。手順をタップすると、そこから再生します。'
    }
  ];

  function mk(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function clear(el){ while (el.firstChild) el.removeChild(el.firstChild); }
  function toPath(p){
    var d = 'M' + p[0][0] + ',' + p[0][1];
    for (var i = 0; i < p.length - 1; i++){
      var p0 = p[i-1] || p[i], p1 = p[i], p2 = p[i+1], p3 = p[i+2] || p[i+1];
      var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
      var c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
      d += ' C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0] + ',' + p2[1];
    }
    return d;
  }
  function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
  function ease(u){ return u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2; }
  function prog(m, t){ return ease(clamp((t - m.t0) / (m.t1 - m.t0), 0, 1)); }

  var svg = document.getElementById('court');
  var ghosts = document.getElementById('ghosts');
  var plan = document.getElementById('plan');
  var barsG = document.getElementById('bars');
  var trailsG = document.getElementById('trails');
  var playersG = document.getElementById('players');
  var metaEl = document.getElementById('meta');
  var tabsEl = document.getElementById('tabs');
  var stepList = document.getElementById('stepList');
  var noteEl = document.getElementById('note');
  var playBtn = document.getElementById('playBtn');
  var replayBtn = document.getElementById('replayBtn');
  var scrub = document.getElementById('scrub');
  var timeOut = document.getElementById('timeOut');
  var loopChk = document.getElementById('loopChk');
  var planChk = document.getElementById('planChk');
  var speedBtns = Array.prototype.slice.call(document.querySelectorAll('[data-speed]'));

  var ICON_PLAY = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l12 7-12 7z"/></svg><span>再生</span>';
  var ICON_PAUSE = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h3.5v14H5zM11.5 3H15v14h-3.5z"/></svg><span>一時停止</span>';

  var cur = -1, P = null, TOTAL = 1, pl = {}, stepBtns = [], tabBtns = [];
  var t = 0, playing = false, speed = 1, last = null;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  PLAYS.forEach(function(p, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p.label;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function(){
      try { location.hash = 'play' + (i + 1); } catch (e) {}
      select(i);
    });
    tabsEl.appendChild(b);
    tabBtns.push(b);
  });

  function buildSteps(){
    clear(stepList);
    P.steps.forEach(function(s, i){
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'step';
      b.innerHTML = '<span class="when">手順' + (i + 1) + ' ・ ' + s.t.toFixed(1) + '秒〜</span><span class="what">' + s.html + '</span>';
      b.addEventListener('click', function(){ t = s.t; render(); setPlaying(true); });
      li.appendChild(b);
      stepList.appendChild(li);
    });
    stepBtns = Array.prototype.slice.call(stepList.querySelectorAll('.step'));
    noteEl.innerHTML = P.note;
  }

  function load(i){
    cur = i;
    P = PLAYS[i];
    TOTAL = P.total;
    clear(ghosts); clear(plan); clear(barsG); clear(trailsG); clear(playersG);

    var movers = {};
    P.moves.forEach(function(m){ movers[m.who] = true; });
    Object.keys(movers).forEach(function(w){
      ghosts.appendChild(mk('circle', { cx:P.start[w][0], cy:P.start[w][1], r:46, 'class':'ghost' }));
    });

    P.moves.forEach(function(m){
      var d = toPath(m.pts);
      var trail = mk('path', { d:d, 'class':'trail p' + m.who });
      trailsG.appendChild(trail);
      m.trail = trail;
      m.len = trail.getTotalLength();
      trail.style.strokeDasharray = m.len + ' ' + (m.len + 20);
      trail.style.strokeDashoffset = m.len;

      plan.appendChild(mk('path', { d:d, 'class':'plan-line p' + m.who }));
      var e = trail.getPointAtLength(m.len), q = trail.getPointAtLength(m.len - 30);
      var a = Math.atan2(e.y - q.y, e.x - q.x) * 180 / Math.PI;
      plan.appendChild(mk('path', {
        d:'M0,0 L-40,-22 L-40,22 Z',
        transform:'translate(' + e.x.toFixed(1) + ' ' + e.y.toFixed(1) + ') rotate(' + a.toFixed(1) + ')',
        'class':'plan-head p' + m.who
      }));
    });

    P.bars.forEach(function(b){
      b.el = mk('line', { x1:b.x1, y1:b.y1, x2:b.x2, y2:b.y2, 'class':'bar ' + b.cls, opacity:'0.28' });
      barsG.appendChild(b.el);
    });

    pl = {};
    Object.keys(P.start).forEach(function(w){
      var g = mk('g', { 'class':'pl p' + w, transform:'translate(' + P.start[w][0] + ' ' + P.start[w][1] + ')' });
      g.appendChild(mk('circle', { r:46 }));
      var tx = mk('text', { 'class':'plabel', 'text-anchor':'middle', dy:'.35em' });
      tx.textContent = w;
      g.appendChild(tx);
      playersG.appendChild(g);
      pl[w] = g;
    });

    metaEl.textContent = P.meta;
    svg.setAttribute('aria-label', P.aria);
    tabBtns.forEach(function(b, k){ b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
    buildSteps();
  }

  function render(){
    var tt = clamp(t, 0, TOTAL);
    var pos = {};
    for (var w in P.start) pos[w] = P.start[w];
    P.moves.forEach(function(m){
      var u = prog(m, tt);
      m.trail.style.strokeDashoffset = m.len * (1 - u);
      if (u > 0){
        var pt = m.trail.getPointAtLength(u * m.len);
        pos[m.who] = [pt.x, pt.y];
      }
    });
    for (var k in pl) pl[k].setAttribute('transform', 'translate(' + pos[k][0].toFixed(1) + ' ' + pos[k][1].toFixed(1) + ')');

    P.bars.forEach(function(b){
      var fin = clamp((tt - b.inT) / 0.4, 0, 1);
      var fout = b.outT == null ? 1 : 1 - clamp((tt - b.outT) / 0.4, 0, 1);
      b.el.setAttribute('opacity', (0.28 + 0.72 * Math.min(fin, fout)).toFixed(2));
    });

    scrub.value = Math.round(tt / TOTAL * 1000);
    timeOut.textContent = tt.toFixed(1) + ' / ' + TOTAL.toFixed(1) + '秒';

    var idx = 0;
    P.steps.forEach(function(s, i){ if (tt >= s.t) idx = i; });
    stepBtns.forEach(function(b, i){
      if (i === idx) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
  }

  function frame(now){
    if (!playing){ last = null; return; }
    if (last == null) last = now;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    t += dt * speed;
    if (loopChk.checked){
      if (t >= TOTAL + END_HOLD) t = -START_HOLD;
    } else if (t >= TOTAL){
      t = TOTAL;
      render();
      setPlaying(false);
      return;
    }
    render();
    requestAnimationFrame(frame);
  }

  function setPlaying(v){
    playing = v;
    playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute('aria-label', v ? '一時停止' : '再生');
    if (v){
      if (t >= TOTAL - 0.01) t = 0;
      last = null;
      requestAnimationFrame(frame);
    }
  }

  function select(i){
    if (i === cur) return;
    playing = false;
    load(i);
    t = 0;
    render();
    setPlaying(false);
    if (!reduce) setTimeout(function(){ if (cur === i && t === 0 && !playing) setPlaying(true); }, 500);
  }

  function indexFromHash(){
    var m = /^#play(\d+)$/.exec(location.hash || '');
    var n = m ? parseInt(m[1], 10) : 1;
    return (n >= 1 && n <= PLAYS.length) ? n - 1 : 0;
  }

  playBtn.addEventListener('click', function(){ setPlaying(!playing); });
  replayBtn.addEventListener('click', function(){ t = 0; render(); setPlaying(true); });
  scrub.addEventListener('input', function(){
    t = scrub.value / 1000 * TOTAL;
    if (playing) setPlaying(false);
    render();
  });
  speedBtns.forEach(function(b){
    b.addEventListener('click', function(){
      speed = parseFloat(b.getAttribute('data-speed'));
      speedBtns.forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    });
  });
  planChk.addEventListener('change', function(){ plan.style.display = planChk.checked ? '' : 'none'; });
  window.addEventListener('hashchange', function(){ select(indexFromHash()); });

  setPlaying(false);
  select(indexFromHash());
})();
</script>
</body>
</html>
